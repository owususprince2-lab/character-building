<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Building LMS</title><style>body{font-family:Arial,sans-serif;background:#f4f8ff;color:#102a43;margin:0}.wrap{max-width:980px;margin:auto;padding:30px}.card{background:white;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #0b4ea215}button{background:#0757a6;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}input,select{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}.brand{color:#0757a6}.module{padding:12px;border-left:4px solid #0757a6;background:#f7fbff;margin:8px 0}.muted{color:#667085}.hidden{display:none}</style></head><body><div class="wrap"><h1 class="brand">Character Building</h1><p class="muted">Structured Learning by Doing • 12-week programme</p><div id="root"></div></div><script>const root=document.getElementById('root');
function home(){root.innerHTML=`<div class="card"><h2>Student Portal</h2><button onclick="register()">Register</button> <button onclick="login()">Login</button><hr><h2>Facilitator</h2><button onclick="login()">Instructor Login</button></div>`}
function register(){root.innerHTML=`<div class="card"><h2>Register</h2><input id="name" placeholder="Full name"><input id="dob" type="date"><select id="prof"><option value="">Select profession</option><option>Student</option><option>Teacher / Lecturer</option><option>Engineer</option><option>Medical / Health Professional</option><option>Business Owner / Entrepreneur</option><option>Public Servant</option><option>Administrator</option><option>Accountant / Finance Professional</option><option>Lawyer / Legal Professional</option><option>IT / Technology Professional</option><option>Artisan / Skilled Worker</option><option>Trader</option><option>Farmer</option><option>Unemployed / Job Seeker</option><option>Other</option></select><input id="email" type="email" placeholder="Email address"><input id="phone" placeholder="Mobile Money phone number"><select id="term"><option>October - December</option><option disabled>January - March (Locked)</option><option disabled>June - August (Locked)</option></select><button onclick="submitReg()">Continue</button></div>`}
function submitReg(){google.script.run.withSuccessHandler(r=>{root.innerHTML=`<div class="card"><h2>Registration created</h2><p>${r.message}</p><p>Username reserved: <b>${r.username}</b></p><p>Check your email and verify it before payment.</p><button onclick="payment('${r.studentId}')">Continue to payment</button></div>`}).withFailureHandler(e=>alert(e.message)).registerStudent({fullName:name.value,dob:dob.value,profession:prof.value,email:email.value,phone:phone.value,term:term.value})}
function payment(id){root.innerHTML=`<div class="card"><h2>Registration payment</h2><p>Registration fee: <b>GHS 300</b></p><p>After you click the button, Paystack will initiate the MTN Mobile Money payment process. Approve the prompt on your phone.</p><button onclick="startPay('${id}')">Pay GHS 300 with MTN MoMo</button><p id="status"></p></div>`}
function startPay(id){google.script.run.withSuccessHandler(r=>{document.getElementById('status').innerText=r.message||'Approve the prompt on your phone. Your access is activated only after server-side verification.'}).withFailureHandler(e=>alert(e.message)).initiateMomoPayment(id)}
function login(){root.innerHTML=`<div class="card"><h2>Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="doLogin()">Login</button></div>`}
function doLogin(){google.script.run.withSuccessHandler(r=>{if(r.role==='instructor') instructor(); else student(r)}).withFailureHandler(e=>alert(e.message)).login(u.value,p.value)}
function student(r){root.innerHTML=`<div class="card"><h2>Welcome, ${r.name}</h2><p>Term: ${r.term}</p><p>Payment: <b>${r.paymentStatus}</b></p><h3>12 Core Competence Modules</h3>${r.modules.map((m,i)=>`<div class="module"><b>Week ${m[2]} — Module ${i+1}: ${m[1]}</b></div>`).join('')}</div>`}
function instructor(){root.innerHTML=`<div class="card"><h2>Facilitator Dashboard</h2><p>Manage the Character Building programme.</p><button>Upload Course Material</button> <button>Create Assignment</button> <button>Create Quiz</button> <button>Post Announcement</button><h3>Modules</h3>${['Self Awareness and Identity Clarity','Emotional Intelligence (EQ)','Ethical Reasoning and Values','Goal Setting and Direction','Personal Productivity Systems','Foundational Financial Literacy','Digital Responsibility','Resilience and Mental Stability','Civic Engagement and National Responsibility','Interpersonal Leadership and Conflict Resolution','Radical Honesty and Accountability (Anti Corruption)','Excellence, Order and Property Care'].map((x,i)=>`<div class="module">Module ${i+1}: ${x}</div>`).join('')}</div>`}
home();</script></body></html>
